[package]
name = "replaybox"
version = "0.1.0"
description = "Game recording catalog and VFR-safe clip editor"
authors = ["William Barrence"]
edition = "2021"
default-run = "replaybox"

[lib]
name = "replaybox_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "replayboxd"
path = "src/bin/replayboxd.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
notify = "7"
walkdir = "2"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2"
parking_lot = "0.12"
tiny_http = "0.12"
urlencoding = "2"
